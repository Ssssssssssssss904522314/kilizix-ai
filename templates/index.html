<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kilizix AI</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Inter,system-ui,sans-serif;background:#07070a;color:#f5f5f7;display:flex;justify-content:center}
.app{width:min(980px,100%);min-height:100vh;display:flex;flex-direction:column;padding:24px}
header{padding:18px 4px 20px;display:flex;align-items:center;gap:12px}
.logo{width:44px;height:44px;border-radius:14px;background:linear-gradient(135deg,#fff,#777);color:#08080a;display:grid;place-items:center;font-weight:900;font-size:20px;box-shadow:0 8px 30px #0008}
h1{font-size:22px;margin:0}.sub{color:#8f8f99;font-size:13px;margin-top:3px}
.chat{flex:1;border:1px solid #ffffff16;border-radius:26px;background:#ffffff05;backdrop-filter:blur(20px);padding:20px;overflow:auto;min-height:55vh}
.msg{max-width:78%;padding:13px 16px;border-radius:18px;margin:10px 0;line-height:1.5;white-space:pre-wrap}
.user{margin-left:auto;background:#f2f2f2;color:#111}.assistant{background:#17171c;border:1px solid #ffffff10}
.composer{display:flex;gap:10px;margin-top:14px}.composer input{flex:1;background:#121217;border:1px solid #ffffff18;color:#fff;border-radius:18px;padding:15px 17px;outline:none;font-size:15px}.composer button{border:0;border-radius:18px;padding:0 22px;background:#fff;color:#111;font-weight:700;cursor:pointer}.composer button:disabled{opacity:.5}
@media(max-width:600px){.app{padding:12px}.msg{max-width:90%}.composer button{padding:0 16px}}
</style>
</head>
<body>
<div class="app">
<header><div class="logo">K</div><div><h1>Kilizix AI</h1><div class="sub">Ваш новый AI-помощник</div></div></header>
<main class="chat" id="chat"><div class="msg assistant">Привет! Я Kilizix AI. Напишите мне сообщение.</div></main>
<form class="composer" id="form"><input id="input" autocomplete="off" placeholder="Напишите сообщение..." /><button id="send">➤</button></form>
</div>
<script>
const chat=document.getElementById('chat'),form=document.getElementById('form'),input=document.getElementById('input'),send=document.getElementById('send');
const messages=[];
function add(role,text){const d=document.createElement('div');d.className='msg '+role;d.textContent=text;chat.appendChild(d);chat.scrollTop=chat.scrollHeight}
form.addEventListener('submit',async e=>{
 e.preventDefault(); const text=input.value.trim(); if(!text)return;
 messages.push({role:'user',content:text}); add('user',text); input.value=''; send.disabled=true;
 try{const r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({messages})});const data=await r.json(); if(!r.ok)throw new Error(data.error||'Ошибка');
 messages.push({role:'assistant',content:data.reply}); add('assistant',data.reply);
 }catch(err){add('assistant','Ошибка: '+err.message)}finally{send.disabled=false;input.focus()}
});
</script>
</body>
</html>
